<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LectureSense | Signing in...</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #f8fbff 0%, #eef3ff 45%, #f3f4ff 100%);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .callback-panel {
        text-align: center;
        max-width: 500px;
      }
      .spinner {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border: 4px solid rgba(37, 99, 235, 0.1);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
        letter-spacing: -0.04em;
        color: #0f172a;
      }
      p {
        color: #64748b;
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0;
      }
      .error {
        background: #fee2e2;
        border: 1px solid #fca5a5;
        border-radius: 12px;
        padding: 16px;
        margin-top: 20px;
        color: #991b1b;
        text-align: left;
      }
      .error-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .retry-link {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
      }
      .retry-link:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="callback-panel">
      <div class="spinner"></div>
      <h1>Signing in...</h1>
      <p id="message">Completing your authentication. Please wait.</p>
      <div id="errorBox" class="error" style="display: none;">
        <div class="error-title">Authentication Error</div>
        <div id="errorMessage"></div>
        <a href="auth.html" class="retry-link">Back to Login</a>
      </div>
    </div>

    <script>
      async function handleOAuthCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const state = params.get('state');
        
        if (error) {
          showError(`OAuth Error: ${error}`);
          return;
        }
        
        if (!code) {
          showError('No authorization code received.');
          return;
        }
        
        try {
          // Determine which OAuth provider from the referrer or state
          const provider = state || 'google';
          const endpoint = provider === 'github' 
            ? `/api/oauth/github/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`
            : `/api/oauth/google/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
          
          const response = await fetch(endpoint);
          const data = await response.json();
          
          if (!response.ok || !data.success) {
            throw new Error(data.message || data.detail || 'Authentication failed');
          }
          
          // Store user info
          if (data.user) {
            localStorage.setItem('lectureSenseUser', JSON.stringify(data.user));
          }
          
          // Redirect to dashboard
          document.getElementById('message').textContent = 'Success! Redirecting to dashboard...';
          setTimeout(() => {
            window.location.href = data.redirect || 'dashboard.html';
          }, 500);
          
        } catch (error) {
          showError(error.message);
        }
      }
      
      function showError(message) {
        document.querySelector('.spinner').style.display = 'none';
        document.getElementById('message').style.display = 'none';
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorMessage').textContent = message;
      }
      
      // Start the OAuth callback process
      handleOAuthCallback();
    </script>
  </body>
</html>
